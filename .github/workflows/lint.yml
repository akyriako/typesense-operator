name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # only-new-issues reads the pull request diff through the GitHub API
      pull-requests: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          # Pull requests and pushes only fail on issues they introduce.
          # Run the workflow manually to list every existing issue.
          only-new-issues: ${{ github.event_name != 'workflow_dispatch' }}

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Regenerate manifests and code
        run: make manifests generate

      - name: Check that generated files are committed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            git diff
            echo "::error::Generated files are out of date. Run 'make manifests generate' and commit the result."
            exit 1
          fi

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint chart
        run: helm lint charts/typesense-operator

      - name: Render chart
        run: helm template typesense-operator charts/typesense-operator > /dev/null
